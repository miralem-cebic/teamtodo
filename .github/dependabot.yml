version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    # typescript-eslint 8.x refuses to load with TypeScript 7.0 and plans
    # support from 7.1 on: https://github.com/typescript-eslint/typescript-eslint/issues/10940
    ignore:
      - dependency-name: typescript
        versions:
          - "7.0.x"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
